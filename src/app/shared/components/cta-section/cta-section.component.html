<section class="cta-section">
  <div class="image-wrapper">
    <img [src]="imageSrc()" [alt]="imageAlt()" />
    <div class="overlay">
      <div class="content">
        <h2 class="title">{{ title() }}</h2>
        <p class="subtitle">{{ subtitle() }}</p>
      </div>
    </div>
  </div>
</section>
