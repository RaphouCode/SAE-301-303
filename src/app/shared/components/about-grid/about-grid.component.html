<div class="items-list">
    @for (item of items(); track item.title; let i = $index) {
    <!-- Alternance Zig-Zag -->
    <!-- i pair (0, 2) : Image Gauche / Texte Droite -->
    <!-- i impair (1, 3) : Texte Gauche / Image Droite -->
    <div class="about-item" [class.reverse]="i % 2 !== 0">

        <div class="image-wrapper">
            <img [src]="item.image" [alt]="item.title" />
        </div>

        <div class="content">
            <h2>{{ item.title }}</h2>
            <p>{{ item.description }}</p>
        </div>

    </div>
    }
</div>
