<section class="hero-section">
  <div class="container">
    <div class="hero-content">
      <div class="branding">
        <h1 class="brand-name">SUSHIMI</h1>
        <div class="logo-container">
          <img [src]="'/assets/images/sushimi_logo_hum 1.svg'" alt="Logo Sushimi" class="logo" />
        </div>
      </div>

      <div class="gallery">
        <!-- Left Column -->
        <div class="gallery-column-left">
          <div class="gallery-item gallery-item-3">
            <img src="/assets/images/sushi-5364661_1280.svg" alt="Plateau de sushi" />
          </div>
          <div class="gallery-item gallery-item-2">
            <img src="/assets/images/sushi-4956246_1280 3.svg" alt="Sushi au saumon" />
          </div>
        </div>

        <!-- Right Column -->
        <div class="gallery-column-right">
          <div class="gallery-item gallery-item-1">
            <img src="/assets/images/sushi-2454444_1280.svg" alt="Sushi aux crevettes" />
          </div>
        </div>
      </div>
    </div>
    <div class="pattern-background"></div>
  </div>
</section>
