<div class="login-wrapper">
  <div class="login-container">
    <h2 class="title">Se connecter</h2>

    <p class="subtitle">
      Vous ne possedez pas de compte ?
      <a href="#" (click)="onRegisterClick($event)">S’inscrire</a>
    </p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" />
      </div>

      <div class="form-group password-group">
        <label for="mdp">Mot de passe</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" id="mdp" formControlName="mot_de_passe" />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
              </path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <a href="#" class="forgot-pwd">Mot de passe oublié ?</a>
      </div>

      <button type="submit" [disabled]="form.invalid" class="submit-btn">
        Se connecter
      </button>
    </form>

    <div *ngIf="message" class="error-msg">
      {{ message }}
    </div>
  </div>
</div>
