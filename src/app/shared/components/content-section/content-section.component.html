<section class="content-section" [class.reverse]="reverse()">
  <div class="container">
    <div class="content-wrapper" [class.reverse]="reverse()">
      <div class="text-content" #textContent>
        <h2 class="title">{{ title() }}</h2>
        <p class="text">{{ text() }}</p>
      </div>
      <div class="image-content" #imageContent>
        <div class="image-wrapper">
          <img [src]="imageSrc()" [alt]="imageAlt()" />
        </div>
        <div class="pattern-overlay"></div>
      </div>
    </div>
  </div>
</section>
