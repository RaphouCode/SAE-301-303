<section>
  @if (isLoggedIn) {
  <!-- Dumb Component: Affiche le message de bienvenue -->
  <app-user-welcome [userName]="userFullName" [userEmail]="userEmail" (logout)="onLogout()" />
  } @else {
  <!-- Login / Register forms -->
  @if (isLoginMode) {
  <app-login-form (switchToRegister)="toggleView()" />
  } @else {
  <app-register-form (switchToLogin)="toggleView()" />
  }
  }
</section>
